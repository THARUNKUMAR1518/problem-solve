spring:
  profiles:
    active: dev
  application:
    name: secureassess
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

secureassess:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A"
    # 24 hours (86400 seconds * 1000)
    expiration: 86400000
    # 7 days (604800 seconds * 1000)
    refresh-expiration: 604800000

---
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/secureassess

---
spring:
  config:
    activate:
      on-profile: prod
  data:
    mongodb:
      uri: mongodb://localhost:27017/secureassess_prod
